<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الموظفين</title>
<link rel="manifest" href="/staff-manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#1F5B34">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F8EF;--card:#fff;--ink:#1B2A1F;--mute:#66736a;--g:#1F5B34;--g2:#E1EFD8;--t:#E0482F;--line:#dfe8d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1b261e;--ink:#eef4ea;--mute:#9fb0a4;--g:#7fcf95;--g2:#24382a;--t:#ff7a62;--line:#2c3c31}}
:root[data-theme="dark"]{--bg:#121a14;--card:#1b261e;--ink:#eef4ea;--mute:#9fb0a4;--g:#7fcf95;--g2:#24382a;--t:#ff7a62;--line:#2c3c31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;max-width:480px;margin-inline:auto;min-height:100vh;padding-bottom:84px}
header{padding:18px 18px 8px}
h1{margin:0;font-size:24px;font-weight:800;color:var(--g)}
header p{margin:2px 0 0;color:var(--mute);font-size:14px}
section{display:none;padding:8px 16px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 16px;font:inherit;font-size:14px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.big{display:block;width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:15px}
.mute{color:var(--mute)}
.small{font-size:12px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
ul.items{margin:6px 0;padding-inline-start:20px}
.times{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.9}
.times b{color:var(--ink)}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin-inline:auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding:env(safe-area-inset-bottom,0px) 4px 0;overflow-x:auto}
nav button{flex:1;min-width:58px;background:none;border:0;color:var(--mute);font:inherit;font-size:10.5px;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
nav button span{font-size:19px}
nav button.on{color:var(--g);font-weight:700}
.authwrap{padding:40px 20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
table th,table td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table th{color:var(--mute);font-weight:600}
.lowstock{color:var(--t);font-weight:700}

#installBar{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#1F5B34;color:#fff;display:none;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:14px;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
#installBar.show{display:flex}
#installBar button{border:none;border-radius:18px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
#installBtn{background:#fff;color:#1F5B34}
#installClose{background:transparent;color:#fff;font-size:18px;padding:4px 8px}
#iosHint{position:fixed;left:12px;right:12px;bottom:70px;z-index:9999;background:#fff;color:#111;border-radius:12px;padding:14px;font-size:13px;line-height:1.7;box-shadow:0 4px 20px rgba(0,0,0,.3);display:none}
#iosHint.show{display:block}
#iosHint b{color:#1F5B34}
#iosHint .close{position:absolute;top:6px;left:10px;cursor:pointer;color:#888;font-size:16px}
html[data-boot="auth"] #authScreen{display:block!important}
html[data-boot="auth"] #app{display:none!important}
html[data-boot="app"] #authScreen{display:none!important}
html[data-boot="app"] #app{display:block!important}
#bootHi{opacity:.0;transition:opacity .15s}
#bootHi.ready{opacity:1}
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('sf_tok'),r=localStorage.getItem('sf_role');document.documentElement.setAttribute('data-boot', (t&&r)?'app':'auth');})();</script>

<div id="installBar">
  <span>📲 ثبّت التطبيق على شاشتك الرئيسية لسهولة الاستخدام</span>
  <span style="display:flex;gap:6px">
    <button id="installBtn">تثبيت</button>
    <button id="installClose">✕</button>
  </span>
</div>
<div id="iosHint">
  <span class="close" id="iosHintClose">✕</span>
  لتثبيت التطبيق على الآيفون: اضغط زر <b>المشاركة</b> ⬆️ في سفاري، ثم اختر <b>"إضافة إلى الشاشة الرئيسية"</b>.
</div>

<div id="authScreen" class="authwrap" style="display:none">
  <h1>🥬 لوحة الموظفين</h1>
  <p class="mute">سجّل الدخول برقم موبايلك وكلمة السر.</p>
  <div class="card">
    <input id="aPhone" placeholder="رقم الموبايل" inputmode="tel">
    <input id="aPass" type="password" placeholder="كلمة السر">
    <button class="big" id="aGo">دخول</button>
    <p id="aErr" style="color:var(--t)"></p>
  </div>
</div>

<div id="app" style="display:none">
<header><h1 id="hi">🥬 لوحة الموظفين</h1><p>خضار وفواكه طازجة لباب بيتك</p></header>

<section id="store"></section>
<section id="driver"></section>
<section id="delayed"></section>
<section id="categories"></section>
<section id="products"></section>
<section id="stock"></section>
<section id="lowstock"></section>
<section id="shortages"></section>
<section id="complaints"></section>
<section id="team"></section>

</div>

<div id="toast"></div>
<nav id="nav"></nav>

<script>
function $(id){return document.getElementById(id)}
var API="https://fruit-app-production.up.railway.app";
// Session is kept in memory only (not localStorage) so the app always asks to log in again each time it is opened.
var TOK="",ROLE="",MYID=0,MYNAME="";

function apiCall(method,path,body){
  var opt={method:method,headers:{"Content-Type":"application/json"}};
  if(TOK)opt.headers.Authorization="Bearer "+TOK;
  if(body)opt.body=JSON.stringify(body);
  return fetch(API+path,opt).then(function(r){
    if(r.status===401){logout();return{}}
    return r.json().catch(function(){return{}})
  });
}
function logout(){TOK="";ROLE="";MYID=0;MYNAME="";location.reload()}
function toast(t){var x=$("toast");x.textContent=t;x.className="show";setTimeout(function(){x.className=""},1600)}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dt(s){
  if(!s)return null;
  var d=new Date(s);
  return d.toLocaleString("ar-EG",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
}

var RN={prep:"تجهيز",delivery:"توصيل",admin:"إدارة"};
var NAV={
  prep:[["store","🧑‍🍳","التجهيز"]],
  delivery:[["driver","🛵","التوصيل"]],
  admin:[["store","🧑‍🍳","التجهيز"],["driver","🛵","التوصيل"],["delayed","⏰","المتأخرة"],["categories","🗂️","الأقسام"],["products","🥕","المنتجات"],["stock","📦","المخزون"],["lowstock","⚠️","الأصناف الناقصة"],["shortages","🚫","محاولات شراء فاشلة"],["complaints","📝","الشكاوى"],["team","👥","الموظفون"]]
};
function buildNav(){
  var items=(NAV[ROLE]||[]).concat([["out","🚪","خروج"]]);
  $("nav").innerHTML=items.map(function(it,i){return '<button data-t="'+it[0]+'"'+(i===0?' class="on"':'')+'><span>'+it[1]+'</span>'+it[2]+'</button>'}).join("");
}
function go(t){
  if(t==="out"){logout();return}
  document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id===t)});
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});
  window.scrollTo(0,0);
  if(t==="team")teamLoad();
  if(t==="store"||t==="driver")ordShell();
  if(t==="delayed"){DLY=null;delayedShell()}
  if(t==="categories")catLoad();
  if(t==="products")prodLoad();
  if(t==="stock")stockLoad();
  if(t==="lowstock"){LOWSTK=null;lowStockShell()}
  if(t==="shortages"){SHORT=null;shortagesShell()}
  if(t==="complaints"){COMPL=null;complaintsShell()}
}

/* ---------- team (admin) ---------- */
var TM=[],editId=0;
function teamLoad(){apiCall("GET","/staff-list").then(function(r){TM=Array.isArray(r)?r:[];teamV()}).catch(function(){})}
function teamV(){
  var el=$("team");if(!el)return;
  var e=TM.find(function(m){return m.id===editId});
  el.innerHTML='<h1 style="font-size:19px">👥 الموظفون</h1>'+
    (TM.length?TM.map(function(m){return '<div class="card"><b>'+esc(m.name)+'</b> — '+esc(m.job_title||"بدون مسمى")+'<br><span class="mute">'+RN[m.role]+' · '+esc(m.phone)+(m.active?'':' · موقوف')+'</span><br><button class="chip" data-te="'+m.id+'" style="margin-top:8px">تعديل</button> <button class="chip" data-tg="'+m.id+'">'+(m.active?'إيقاف':'تفعيل')+'</button></div>'}).join(''):'<p class="mute">لا يوجد موظفون بعد.</p>')+
    '<div class="card"><h2>'+(e?'تعديل موظف':'إضافة موظف جديد')+'</h2>'+
    '<input id="tN" placeholder="الاسم" value="'+esc(e&&e.name)+'">'+
    '<input id="tT" placeholder="المسمى الوظيفي (اختياري)" value="'+esc(e&&e.job_title)+'">'+
    '<input id="tP" placeholder="رقم الموبايل" inputmode="tel" value="'+esc(e&&e.phone)+'"'+(e?' disabled':'')+'>'+
    '<input id="tW" type="password" placeholder="'+(e?'كلمة سر جديدة (اختياري)':'كلمة السر (6 أحرف على الأقل)')+'">'+
    '<select id="tR"><option value="prep">تجهيز</option><option value="delivery">توصيل</option><option value="admin">إدارة</option></select>'+
    '<button class="big" id="tAdd">'+(e?'حفظ التعديل':'إضافة')+'</button>'+
    (e?' <button class="chip" id="tCan" style="margin-top:8px">إلغاء</button>':'')+
    '<p id="tErr" style="color:var(--t)"></p></div>';
  if(e)$("tR").value=e.role;
}

/* ---------- categories (admin only) ---------- */
var CATL=[],editCid=0;
var SWATCHES=["#D7F0E3","#FFEAD1","#D9E9FB","#FBE1EC","#FFF3C4","#E3DEF8"];
function catLoad(){apiCall("GET","/categories").then(function(r){CATL=Array.isArray(r)?r:[];catV()}).catch(function(){})}
function catV(){
  var el=$("categories");if(!el)return;
  var e=CATL.find(function(c){return c.id===editCid});
  el.innerHTML='<h1 style="font-size:19px">🗂️ إدارة الأقسام</h1>'+
    (CATL.length?CATL.map(function(c){return '<div class="card row"><div style="display:flex;align-items:center;gap:10px"><span style="background:'+esc(c.color)+';border-radius:10px;padding:6px 10px;font-size:20px">'+esc(c.emoji)+'</span><b>'+esc(c.name)+'</b></div><div><button class="chip" data-ce="'+c.id+'">تعديل</button> <button class="chip" style="color:var(--t)" data-cd="'+c.id+'">حذف</button></div></div>'}).join(''):'<p class="mute">لا توجد أقسام بعد.</p>')+
    '<div class="card"><h2>'+(e?'تعديل قسم':'إضافة قسم جديد')+'</h2>'+
    '<input id="cN" placeholder="اسم القسم" value="'+esc(e&&e.name)+'">'+
    '<input id="cE" placeholder="إيموجي (مثال 🥦)" value="'+esc(e&&e.emoji)+'">'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0" id="cColors">'+SWATCHES.map(function(s){return '<button type="button" class="chip" data-sw="'+s+'" style="background:'+s+';width:36px;height:36px;padding:0;border-radius:10px"></button>'}).join('')+'</div>'+
    '<input id="cColor" type="hidden" value="'+(e?esc(e.color):SWATCHES[0])+'">'+
    '<input id="cOrder" type="number" placeholder="ترتيب الظهور (اختياري)" value="'+(e?e.sort_order:"")+'">'+
    '<button class="big" id="cAdd">'+(e?'حفظ التعديل':'إضافة')+'</button>'+
    (e?' <button class="chip" id="cCan" style="margin-top:8px">إلغاء</button>':'')+
    '<p id="cErr" style="color:var(--t)"></p></div>';
}

/* ---------- products (admin only) ---------- */
var PR=[],editPid=0;
function prodLoad(){apiCall("GET","/products").then(function(r){PR=Array.isArray(r)?r:[];prodV()}).catch(function(){})}
function prodV(){
  var el=$("products");if(!el)return;
  var e=PR.find(function(p){return p.id===editPid});
  var catOpts=CATL.length?CATL.map(function(c){return '<option value="'+esc(c.name)+'">'+esc(c.name)+'</option>'}).join(''):'<option value="">أضف قسمًا أولًا من تبويب الأقسام</option>';
  el.innerHTML='<h1 style="font-size:19px">🥕 إدارة المنتجات</h1>'+
    (PR.length?PR.map(function(p){return '<div class="card row"><div><b>'+(p.emoji||"")+' '+esc(p.name)+'</b><br><span class="mute">'+p.price+' ج.م / '+esc(p.unit)+' · '+esc(p.category)+'</span></div><div><button class="chip" data-pe="'+p.id+'">تعديل</button> <button class="chip" style="color:var(--t)" data-pd="'+p.id+'">حذف</button></div></div>'}).join(''):'<p class="mute">لا توجد منتجات بعد.</p>')+
    '<div class="card"><h2>'+(e?'تعديل منتج':'إضافة منتج جديد')+'</h2>'+
    '<input id="pN" placeholder="اسم المنتج" value="'+esc(e&&e.name)+'">'+
    '<input id="pE" placeholder="إيموجي (مثال 🍅)" value="'+esc(e&&e.emoji)+'">'+
    '<input id="pImg" placeholder="رابط صورة (اختياري)" value="'+esc(e&&e.image_url)+'">'+
    '<input id="pP" type="number" placeholder="السعر" value="'+(e?e.price:"")+'">'+
    '<select id="pU"><option value="كيلو">كيلو</option><option value="حزمة">حزمة</option><option value="قطعة">قطعة</option></select>'+
    '<select id="pC">'+catOpts+'</select>'+
    (e?'':'<input id="pS" type="number" placeholder="الكمية الأولية بالمخزون" value="0">')+
    '<input id="pLow" type="number" placeholder="الحد الحرج لإعادة الطلب (اختياري)" value="'+(e&&e.low_stock_threshold?e.low_stock_threshold:"")+'">'+
    '<button class="big" id="pAdd">'+(e?'حفظ التعديل':'إضافة')+'</button>'+
    (e?' <button class="chip" id="pCan" style="margin-top:8px">إلغاء</button>':'')+
    '<p id="pErr" style="color:var(--t)"></p></div>';
  if(e){$("pU").value=e.unit;$("pC").value=e.category}
}

/* ---------- stock (admin only) ---------- */
var STK={products:[],movements:[]};
var TYN={purchase:"شراء",sale:"بيع",return:"مرتجع",waste:"تالف",cancel_restock:"إلغاء طلب (رجوع للمخزون)"};
function stockLoad(){apiCall("GET","/stock").then(function(r){STK=r.products?r:{products:[],movements:[]};stockV()}).catch(function(){})}
var LOWSTK=null;
function lowStockShell(){
  $("lowstock").innerHTML='<h1 style="font-size:19px">⚠️ الأصناف الناقصة</h1>'+
    '<p class="mute" style="margin:0 0 10px">استعلام عن كل صنف وصلت كميته المتاحة إلى الحد الحرج المحدد له أو أقل، عشان تعيد طلبه.</p>'+
    '<div class="card"><button class="big" id="lowGo">🔍 استعلم الآن</button></div>'+
    lowStockBlock();
}
function lowStockQuery(){
  apiCall("GET","/stock/low").then(function(r){LOWSTK=Array.isArray(r)?r:[];lowStockShell()}).catch(function(){LOWSTK=[];lowStockShell()});
}
function lowStockBlock(){
  if(LOWSTK===null)return'';
  return '<div class="card"><h2>نتيجة الاستعلام</h2>'+
    (LOWSTK.length?'<table><tr><th>المنتج</th><th>المتاح</th><th>الحد الحرج</th></tr>'+
      LOWSTK.map(function(p){return '<tr><td>'+(p.emoji||"")+' '+esc(p.name)+'</td><td class="lowstock">'+p.stock_qty+' '+esc(p.unit)+'</td><td>'+p.low_stock_threshold+'</td></tr>'}).join('')+'</table>'
      :'<p class="mute">لا توجد أصناف وصلت للحد الحرج حاليًا 🎉</p>')+
    '</div>';
}

/* ---------- failed order attempts due to insufficient stock (admin only) ---------- */
var SHORT=null;
function shortagesShell(){
  $("shortages").innerHTML='<h1 style="font-size:19px">🚫 محاولات شراء فاشلة</h1>'+
    '<p class="mute" style="margin:0 0 10px">محاولات عملاء لطلب كمية من صنف غير متوفرة بالكامل في المخزون، مع اسم العميل والوقت.</p>'+
    '<div class="card"><button class="big" id="shortGo">🔍 استعلم الآن</button></div>'+
    shortagesBlock();
}
function shortagesQuery(){
  apiCall("GET","/stock/shortages").then(function(r){SHORT=Array.isArray(r)?r:[];shortagesShell()}).catch(function(){SHORT=[];shortagesShell()});
}
function shortagesBlock(){
  if(SHORT===null)return'';
  if(!SHORT.length)return '<div class="card"><p class="mute">لا توجد محاولات شراء فاشلة بسبب نقص المخزون حتى الآن 🎉</p></div>';
  return SHORT.map(function(x){return '<div class="card"><b>'+esc(x.customer_name)+'</b> · '+esc(x.customer_phone)+'<br>حاول طلب '+(x.emoji||"")+' '+esc(x.product_name)+' × '+x.requested_qty+' '+esc(x.unit)+' — المتاح وقتها كان '+x.available_qty+' '+esc(x.unit)+'<br><span class="mute">'+dt(x.created_at)+'</span></div>'}).join('');
}
/* ---------- complaints (admin only) ---------- */
var COMPL=null;
function complaintsShell(){
  $("complaints").innerHTML='<h1 style="font-size:19px">📝 شكاوى وملاحظات العملاء</h1>'+
    '<div class="card"><button class="big" id="complGo">🔍 استعلم الآن</button></div>'+
    complaintsBlock();
}
function complaintsQuery(){
  apiCall("GET","/complaints").then(function(r){COMPL=Array.isArray(r)?r:[];complaintsShell()}).catch(function(){COMPL=[];complaintsShell()});
}
function complaintsBlock(){
  if(COMPL===null)return'';
  if(!COMPL.length)return '<div class="card"><p class="mute">لا توجد شكاوى أو ملاحظات حتى الآن.</p></div>';
  return COMPL.map(function(x){
    return '<div class="card"><b>'+esc(x.customer_name)+'</b> · '+esc(x.customer_phone)+
      (x.message?'<p style="margin:6px 0">'+esc(x.message)+'</p>':'')+
      (x.voice_url?'<audio controls src="'+API+x.voice_url+'" style="width:100%;margin:6px 0"></audio>':'')+
      '<span class="mute">'+dt(x.created_at)+'</span></div>';
  }).join('');
}
function stockV(){
  var el=$("stock");if(!el)return;
  el.innerHTML='<h1 style="font-size:19px">📦 إدارة المخزون</h1>'+
    '<div class="card"><h2>تسجيل حركة</h2>'+
    '<select id="sProd">'+STK.products.map(function(p){return '<option value="'+p.id+'">'+(p.emoji||"")+' '+esc(p.name)+'</option>'}).join('')+'</select>'+
    '<select id="sType"><option value="purchase">شراء (إضافة للمخزون)</option><option value="waste">تالف (خصم من المخزون)</option></select>'+
    '<input id="sQty" type="number" placeholder="الكمية">'+
    '<input id="sNote" placeholder="ملاحظة (اختياري)">'+
    '<button class="big" id="sAdd">تسجيل</button>'+
    '<p id="sErr" style="color:var(--t)"></p></div>'+
    '<div class="card"><table><tr><th>المنتج</th><th>المتاح</th></tr>'+
    STK.products.map(function(p){return '<tr><td>'+(p.emoji||"")+' '+esc(p.name)+'</td><td class="'+(Number(p.stock_qty)<=5?"lowstock":"")+'">'+p.stock_qty+' '+esc(p.unit)+'</td></tr>'}).join('')+
    '</table></div>';
}

/* ---------- orders (prep + delivery) ---------- */
var SO={prep:[],del:[]};
var STN={awaiting_prep:"بانتظار التجهيز",preparing:"جاري التجهيز",awaiting_delivery:"بانتظار التوصيل",on_the_way:"في الطريق",delivered:"تم التسليم"};
var LOADERR="";
var ORD_QUERIED={store:false,driver:false};
function setO(k,r){if(Array.isArray(r)){SO[k]=r;LOADERR=""}else{LOADERR=(r&&(r.message||r.error))||"تعذّر تحميل الطلبات من السيرفر"}}
function errBanner(){return LOADERR?'<p style="background:#5a1f1f;color:#fff;padding:10px;border-radius:10px;margin:8px 0">⚠️ '+esc(LOADERR)+' — الأرقام المعروضة قد تكون قديمة.</p>':''}
function ordLoad(){
  var jobs=[];
  if(ROLE==="prep"||ROLE==="admin")jobs.push(apiCall("GET","/orders/staff/prep").then(function(r){setO("prep",r)}));
  if(ROLE==="delivery"||ROLE==="admin")jobs.push(apiCall("GET","/orders/staff/delivery").then(function(r){setO("del",r)}));
  Promise.all(jobs).then(ordV).catch(function(){});
}
// Shows just a "query" button on tab entry; data is only fetched when the staff member asks for it.
function ordShell(){
  if(ROLE==="prep"||ROLE==="admin"){
    if(ORD_QUERIED.store){ordQuery("store");return}
    $("store").innerHTML='<h1 style="font-size:19px">🧑‍🍳 التجهيز</h1><div class="card"><button class="big" id="storeGo">🔍 استعلم عن الطلبات</button></div>';
  }
  if(ROLE==="delivery"||ROLE==="admin"){
    if(ORD_QUERIED.driver){ordQuery("driver");return}
    $("driver").innerHTML='<h1 style="font-size:19px">🚚 التوصيل</h1><div class="card"><button class="big" id="driverGo">🔍 استعلم عن الطلبات</button></div>';
  }
}
function ordQuery(which){
  ORD_QUERIED[which]=true;
  var jobs=[];
  if(which==="store")jobs.push(apiCall("GET","/orders/staff/prep").then(function(r){setO("prep",r)}));
  if(which==="driver")jobs.push(apiCall("GET","/orders/staff/delivery").then(function(r){setO("del",r)}));
  Promise.all(jobs).then(ordV).catch(function(){});
}
function timesBlock(o){
  var lines=[];
  if(o.created_at)lines.push("سُجّل: <b>"+dt(o.created_at)+"</b>");
  if(o.prep_started_at)lines.push("بدأ التجهيز: <b>"+dt(o.prep_started_at)+"</b>");
  if(o.prepared_at)lines.push("انتهى التجهيز: <b>"+dt(o.prepared_at)+"</b>");
  if(o.delivery_started_at)lines.push("بدأ التوصيل: <b>"+dt(o.delivery_started_at)+"</b>");
  if(o.delivered_at)lines.push("تم التسليم: <b>"+dt(o.delivered_at)+"</b>");
  return lines.length?'<div class="times">'+lines.join("<br>")+'</div>':'';
}
function ocard(o,k){
  var act=null;
  if(ROLE==="prep"&&k==="prep")act=o.status==="awaiting_prep"?["preparing","▶ بدء التجهيز"]:["awaiting_delivery","✅ انتهاء التجهيز"];
  if(ROLE==="delivery"&&k==="del")act=o.status==="awaiting_delivery"?["on_the_way","🚚 بدء التوصيل"]:["delivered","💵 تم التسليم وتحصيل النقدية"];
  return '<div class="card"><b>طلب #'+o.id+'</b> — '+(STN[o.status]||o.status)+'<br>'+esc(o.customer_name)+' · '+esc(o.customer_phone)+(o.address?'<br>📍 '+esc(o.address):'')+
    '<ul class="items">'+(o.items||[]).map(function(i){return '<li>'+esc(i.emoji)+' '+esc(i.name)+' × '+i.quantity+' '+esc(i.unit)+'</li>'}).join('')+'</ul>'+
    '<b>الإجمالي: '+o.total+' ج.م</b>'+timesBlock(o)+
    (act?'<button class="big" style="margin-top:8px" data-ost="'+o.id+':'+act[0]+'">'+act[1]+'</button>':(ROLE==="admin"?'<p class="mute" style="margin:6px 0 0">عرض فقط</p>':''))+
    '</div>';
}
function ordV(){
  if(ROLE==="prep"||ROLE==="admin"){
    var wp=SO.prep.filter(function(o){return o.status==="awaiting_prep"}),pp=SO.prep.filter(function(o){return o.status==="preparing"});
    $("store").innerHTML='<h1 style="font-size:19px">🧑‍🍳 التجهيز</h1>'+errBanner()+
      '<div class="card"><button class="chip" id="storeGo">🔄 إعادة الاستعلام</button></div>'+
      '<h2 style="font-size:15px;margin:10px 0 6px">⏳ بانتظار التجهيز ('+wp.length+')</h2>'+(wp.length?wp.map(function(o){return ocard(o,"prep")}).join(""):'<p class="mute">لا توجد طلبات بانتظار التجهيز.</p>')+
      '<h2 style="font-size:15px;margin:16px 0 6px">🔧 جاري التجهيز ('+pp.length+')</h2>'+(pp.length?pp.map(function(o){return ocard(o,"prep")}).join(""):'<p class="mute">لا توجد طلبات قيد التجهيز حاليًا.</p>');
  }
  if(ROLE==="delivery"||ROLE==="admin"){
    var wd=SO.del.filter(function(o){return o.status==="awaiting_delivery"}),od=SO.del.filter(function(o){return o.status==="on_the_way"}),dd=SO.del.filter(function(o){return o.status==="delivered"});
    $("driver").innerHTML='<h1 style="font-size:19px">🚚 التوصيل</h1>'+errBanner()+
      '<div class="card"><button class="chip" id="driverGo">🔄 إعادة الاستعلام</button></div>'+
      '<h2 style="font-size:15px;margin:10px 0 6px">⏳ بانتظار التوصيل ('+wd.length+')</h2>'+(wd.length?wd.map(function(o){return ocard(o,"del")}).join(""):'<p class="mute">لا توجد طلبات بانتظار التوصيل.</p>')+
      '<h2 style="font-size:15px;margin:16px 0 6px">🛵 في الطريق ('+od.length+')</h2>'+(od.length?od.map(function(o){return ocard(o,"del")}).join(""):'<p class="mute">لا توجد طلبات في الطريق حاليًا.</p>')+
      '<h2 style="font-size:15px;margin:16px 0 6px">✅ تم التسليم والدفع ('+dd.length+')</h2>'+(dd.length?dd.map(function(o){return ocard(o,"del")}).join(""):'<p class="mute">لا توجد طلبات مُسلَّمة بعد.</p>');
  }
}

/* ---------- delayed orders report (admin only) ---------- */
var DLY=null;
function delayedShell(){
  $("delayed").innerHTML='<h1 style="font-size:19px">⏰ الطلبات المتأخرة</h1>'+
    '<p class="mute" style="margin:0 0 10px">طلبات تأخرت أكثر من 30 دقيقة. حدّد المربع لاستعلام الطلبات المتأخرة التي تم تسليمها بالفعل، أو اتركه فارغًا لاستعلام المتأخرة التي لم تُسلَّم بعد.</p>'+
    '<div class="card"><label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" id="dlyDone" style="width:18px;height:18px"> تم تسليمها</label>'+
    '<button class="big" id="dlyGo" style="margin-top:10px">🔍 استعلم</button></div>'+
    delayedResultBlock();
}
function delayedResultBlock(){
  if(DLY===null)return'';
  return (Array.isArray(DLY)&&DLY.length?DLY.map(function(o){
      var mins=o.delivered_at?Math.floor((new Date(o.delivered_at).getTime()-new Date(o.created_at).getTime())/60000):Math.floor((Date.now()-new Date(o.created_at).getTime())/60000);
      var label=o.status==="delivered"?"تأخّر عن التسليم ":"متأخر منذ ";
      return '<div class="card"><b>طلب #'+o.id+'</b> — '+(STN[o.status]||o.status)+'<br>'+esc(o.customer_name)+' · '+esc(o.customer_phone)+(o.address?'<br>📍 '+esc(o.address):'')+
        '<p style="color:var(--t);font-weight:700;margin:8px 0 0">'+label+mins+' دقيقة</p>'+timesBlock(o)+'</div>';
    }).join(""):'<p class="mute">لا توجد نتائج لهذا الاستعلام 🎉</p>');
}
function delayedQuery(){
  var done=$("dlyDone")&&$("dlyDone").checked;
  apiCall("GET","/orders/delayed?delivered="+(done?"1":"0")).then(function(r){
    DLY=Array.isArray(r)?r:[];
    $("delayed").innerHTML='<h1 style="font-size:19px">⏰ الطلبات المتأخرة</h1>'+
      '<p class="mute" style="margin:0 0 10px">طلبات تأخرت أكثر من 30 دقيقة. حدّد المربع لاستعلام الطلبات المتأخرة التي تم تسليمها بالفعل، أو اتركه فارغًا لاستعلام المتأخرة التي لم تُسلَّم بعد.</p>'+
      '<div class="card"><label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" id="dlyDone" style="width:18px;height:18px"'+(done?' checked':'')+'> تم تسليمها</label>'+
      '<button class="big" id="dlyGo" style="margin-top:10px">🔍 استعلم</button></div>'+
      delayedResultBlock();
  }).catch(function(){DLY=[];delayedShell()});
}


/* ---------- auth ---------- */
function startApp(){
  if(!TOK||!ROLE){
    document.documentElement.setAttribute("data-boot","auth");
    $("authScreen").style.display="block";$("app").style.display="none";
    return;
  }
  document.documentElement.setAttribute("data-boot","app");
  $("authScreen").style.display="none";$("app").style.display="block";
  $("hi").textContent="أهلاً "+(MYNAME||"")+" 👋";
  buildNav();
  var first=(NAV[ROLE]||[["store"]])[0][0];
  go(first);
  if(ROLE==="admin")setupPush();
}

/* ---------- push notifications (admin only) ---------- */
function b64ToUint8(b64){
  var pad="=".repeat((4-b64.length%4)%4);
  var base64=(b64+pad).replace(/-/g,"+").replace(/_/g,"/");
  var raw=atob(base64),out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
function setupPush(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window))return;
  navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription().then(function(sub){
      if(sub)return sub;
      if(Notification.permission==="denied")return null;
      return Notification.requestPermission().then(function(perm){
        if(perm!=="granted")return null;
        return apiCall("GET","/push/vapid-public-key").then(function(r){
          return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8(r.key)});
        });
      });
    });
  }).then(function(sub){
    if(sub)apiCall("POST","/push/subscribe",{subscription:sub.toJSON?sub.toJSON():sub}).catch(function(){});
  }).catch(function(){});
}

(function(){
  var deferredPrompt=null;
  var bar=document.getElementById('installBar');
  var btn=document.getElementById('installBtn');
  var closeBtn=document.getElementById('installClose');
  var iosHint=document.getElementById('iosHint');
  var iosHintClose=document.getElementById('iosHintClose');
  var DISMISS_KEY='install_dismissed_staff';

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  }
  function isIos(){
    return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
  }
  if(isStandalone()){ /* already installed, do nothing */ }
  else if(localStorage.getItem(DISMISS_KEY)==='1'){ /* user dismissed before */ }
  else if(isIos()){
    setTimeout(function(){ if(iosHint) iosHint.classList.add('show'); }, 1200);
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt=e;
    if(localStorage.getItem(DISMISS_KEY)!=='1' && bar) bar.classList.add('show');
  });

  if(btn) btn.addEventListener('click', function(){
    if(bar) bar.classList.remove('show');
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt=null; });
  });
  if(closeBtn) closeBtn.addEventListener('click', function(){
    if(bar) bar.classList.remove('show');
    localStorage.setItem(DISMISS_KEY,'1');
  });
  if(iosHintClose) iosHintClose.addEventListener('click', function(){
    if(iosHint) iosHint.classList.remove('show');
    localStorage.setItem(DISMISS_KEY,'1');
  });
  window.addEventListener('appinstalled', function(){
    if(bar) bar.classList.remove('show');
  });
})();

    }).catch(function(){$("sErr").textContent="تعذّر الاتصال بالسيرفر"});

  }

  if(t.id==="lowGo"){lowStockQuery();return}
  if(t.id==="dlyGo"){delayedQuery();return}
  if(t.id==="storeGo"){ordQuery("store");return}
  if(t.id==="driverGo"){ordQuery("driver");return}
  if(t.id==="shortGo"){shortagesQuery();return}

});
